packages:
  - api
  - ui
# `pnpm deploy` copies api/ with real files for the image.
injectWorkspacePackages: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  'vite@*': 'catalog:'
# Install scripts nothing here needs: esbuild ships its binary as an optional
# dependency, and the other two only print or check.
allowBuilds:
  core-js-pure: false
  esbuild: false
  protobufjs: false
