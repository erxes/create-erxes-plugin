name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deliverables:
    uses: ./.github/workflows/deliverables.yml
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check && pnpm lint && pnpm test && pnpm compile linux-x64

  publish:
    needs: [deliverables, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm trusted publishing: npm trusts this workflow through GitHub's OIDC token,
    # so there is no npm token to store or rotate, and npm adds provenance.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish this version when npm does not have it
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm."
            echo "Bump package.json in the merged pull request to publish a new version."
            exit 0
          fi
          npm publish --access public
          echo "published ${name}@${version}"
